name: Catalog refresh

on:
    schedule:
        - cron: '17 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: catalog-refresh
    cancel-in-progress: false

jobs:
    refresh:
        name: Propose an MTA catalog refresh
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: develop

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch the wiki snapshot
              run: pnpm --filter @luam/mta-types fetch-wiki

            - name: Detect whether the wiki moved
              id: snapshot
              run: |
                  if git diff --quiet -- packages/mta-types/data/mta-wiki.json; then
                      echo 'changed=false' >> "$GITHUB_OUTPUT"
                      echo 'The wiki has not moved since the committed snapshot.'
                  else
                      echo 'changed=true' >> "$GITHUB_OUTPUT"
                  fi

            - name: Regenerate the catalog
              if: steps.snapshot.outputs.changed == 'true'
              run: pnpm --filter @luam/mta-types refresh-catalog "$RUNNER_TEMP/catalog-refresh.md"

            - name: Typecheck
              if: steps.snapshot.outputs.changed == 'true'
              run: pnpm -r typecheck

            - name: Test
              if: steps.snapshot.outputs.changed == 'true'
              run: pnpm -r test

            - name: Open the proposal
              if: steps.snapshot.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch="catalog-refresh/${GITHUB_RUN_ID}"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git checkout -b "$branch"
                  git add packages/mta-types/data packages/mta-types/src/generated
                  git commit -m 'chore(mta-types): refresh the catalog from the MTA wiki'
                  git push origin "$branch"
                  gh pr create --base develop --head "$branch" --title 'chore(mta-types): refresh the catalog from the MTA wiki' --body-file "$RUNNER_TEMP/catalog-refresh.md"
