name: Docs

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'examples/**'
            - 'tools/release/**'
            - 'packages/*/package.json'
            - 'CHANGELOG.md'
            - 'README.md'
            - 'package.json'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/docs.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        uses: ./.github/workflows/unit-docs.yml
        permissions:
            contents: read
        with:
            upload-pages: true

    deploy:
        name: Deploy
        needs: validate
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
