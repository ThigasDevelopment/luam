name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            version:
                description: Version to package, without the leading v.
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup

            - name: Version contract
              run: pnpm docs:versions "${{ inputs.version || github.ref_name }}"

            - run: pnpm -r typecheck
            - run: pnpm -r test

            - name: Bundle the CLI
              run: pnpm --filter @luam/cli bundle

            - name: Verify the manual
              run: pnpm docs:verify

    package:
        name: Package
        needs: verify
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.value }}
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup

            - name: Resolve the version
              id: version
              run: node -p "'value=' + require('./packages/cli/package.json').version" >> "$GITHUB_OUTPUT"

            - name: Version contract
              run: pnpm docs:versions "${{ inputs.version || github.ref_name }}"

            - name: Bundle the CLI
              run: pnpm --filter @luam/cli bundle

            - name: Bundle the extension
              run: pnpm --filter luam bundle

            - name: Prepare the artifact directory
              run: mkdir -p "$GITHUB_WORKSPACE/artifacts"

            - name: Package the CLI
              run: npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts" ./packages/cli/dist

            - name: Package the extension
              run: |
                  cd packages/vscode
                  npx --yes @vscode/vsce package --no-dependencies --skip-license --out "$GITHUB_WORKSPACE/artifacts/luam-${{ steps.version.outputs.value }}.vsix"

            - name: Verify the packaged versions
              env:
                  EXPECTED: ${{ steps.version.outputs.value }}
              run: |
                  node -e "const v = require('./packages/cli/dist/package.json').version; if (v !== process.env.EXPECTED) { console.error('The bundled CLI is ' + v + ', not ' + process.env.EXPECTED + '.'); process.exit(1); }"
                  test -f "$GITHUB_WORKSPACE/artifacts/luam-$EXPECTED.vsix"

            - uses: actions/upload-artifact@v4
              with:
                  name: luam-${{ steps.version.outputs.value }}
                  path: artifacts/
                  if-no-files-found: error

    npm:
        name: Publish to npm
        needs: package
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: pipeline
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org

            - name: Bundle the CLI
              run: pnpm --filter @luam/cli bundle

            - name: Publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish ./packages/cli/dist --access public --provenance

    marketplace:
        name: Publish to the VS Code Marketplace
        needs: package
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_MARKETPLACE == 'true'
        runs-on: ubuntu-latest
        environment: pipeline
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: luam-${{ needs.package.outputs.version }}
                  path: artifacts

            - name: Publish the extension
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: |
                  if [ -z "$VSCE_PAT" ]; then
                      echo "VSCE_PAT is not configured. Skipping the Marketplace publish."
                      exit 0
                  fi

                  npx --yes @vscode/vsce publish --packagePath "artifacts/luam-${{ needs.package.outputs.version }}.vsix"

    publish:
        name: Publish
        needs: package
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@v4
              with:
                  name: luam-${{ needs.package.outputs.version }}
                  path: artifacts

            - name: Render the release notes
              run: pnpm --silent release:notes > "$RUNNER_TEMP/notes.md"

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}" artifacts/* \
                      --repo "${{ github.repository }}" \
                      --notes-file "$RUNNER_TEMP/notes.md" \
                      --generate-notes \
                      --verify-tag
