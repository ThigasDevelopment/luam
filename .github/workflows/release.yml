name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            version:
                description: Version to package, without the leading v.
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    typecheck:
        uses: ./.github/workflows/unit-typecheck.yml
        permissions:
            contents: read

    test:
        uses: ./.github/workflows/unit-test.yml
        permissions:
            contents: read

    docs:
        uses: ./.github/workflows/unit-docs.yml
        permissions:
            contents: read

    verify:
        name: Verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup

            - name: Version contract
              env:
                  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
              run: pnpm docs:versions "$RELEASE_VERSION"

    package:
        name: Package
        needs: [verify, typecheck, test, docs]
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            version: ${{ steps.version.outputs.value }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup

            - name: Resolve the version
              id: version
              run: node -p "'value=' + require('./packages/cli/package.json').version" >> "$GITHUB_OUTPUT"

            - name: Bundle the CLI
              run: pnpm --filter @luam/cli bundle

            - name: Bundle the extension
              run: pnpm --filter luam bundle

            - name: Prepare the artifact directory
              run: mkdir -p "$GITHUB_WORKSPACE/artifacts"

            - name: Package the CLI
              run: npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts" ./packages/cli/dist

            - name: Package the extension
              env:
                  EXPECTED: ${{ steps.version.outputs.value }}
              run: |
                  cd packages/vscode
                  npx --yes @vscode/vsce package --no-dependencies --skip-license --out "$GITHUB_WORKSPACE/artifacts/luam-$EXPECTED.vsix"

            - name: Verify the packaged versions
              env:
                  EXPECTED: ${{ steps.version.outputs.value }}
              run: |
                  node -e "const v = require('./packages/cli/dist/package.json').version; if (v !== process.env.EXPECTED) { console.error('The bundled CLI is ' + v + ', not ' + process.env.EXPECTED + '.'); process.exit(1); }"
                  test -f "$GITHUB_WORKSPACE/artifacts/luam-$EXPECTED.vsix"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: luam-${{ steps.version.outputs.value }}
                  path: artifacts/
                  if-no-files-found: error

    npm:
        name: Publish to npm
        needs: package
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: pipeline
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org

            - name: Bundle the CLI
              run: pnpm --filter @luam/cli bundle

            - name: Publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish ./packages/cli/dist --access public --provenance

    marketplace:
        name: Publish to the VS Code Marketplace
        needs: package
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_MARKETPLACE == 'true'
        runs-on: ubuntu-latest
        environment: pipeline
        permissions:
            contents: read
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: luam-${{ needs.package.outputs.version }}
                  path: artifacts

            - name: Publish the extension
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
                  VERSION: ${{ needs.package.outputs.version }}
              run: |
                  if [ -z "$VSCE_PAT" ]; then
                      echo "VSCE_PAT is not configured. Skipping the Marketplace publish."
                      exit 0
                  fi

                  npx --yes @vscode/vsce publish --packagePath "artifacts/luam-$VERSION.vsix"

    publish:
        name: Publish
        needs: package
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: luam-${{ needs.package.outputs.version }}
                  path: artifacts

            - name: Render the release notes
              run: pnpm --silent release:notes > "$RUNNER_TEMP/notes.md"

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  gh release create "$TAG" artifacts/* \
                      --repo "$REPOSITORY" \
                      --notes-file "$RUNNER_TEMP/notes.md" \
                      --generate-notes \
                      --verify-tag
