name: Triage

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: triage-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

jobs:
    label:
        name: Label
        if: github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Resolve the pull request
              id: pull
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  number=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number')
                  echo "number=$number" >> "$GITHUB_OUTPUT"

            - name: Apply the area and size labels
              if: steps.pull.outputs.number != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PULL_REQUEST: ${{ steps.pull.outputs.number }}
              run: node .github/scripts/label-pull-request.mjs
