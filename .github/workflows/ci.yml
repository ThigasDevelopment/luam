name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    typecheck:
        uses: ./.github/workflows/unit-typecheck.yml
        permissions:
            contents: read

    test:
        uses: ./.github/workflows/unit-test.yml
        permissions:
            contents: read

    conventions:
        uses: ./.github/workflows/unit-conventions.yml
        permissions:
            contents: read

    docs:
        uses: ./.github/workflows/unit-docs.yml
        permissions:
            contents: read

    build:
        needs: test
        uses: ./.github/workflows/unit-build.yml
        permissions:
            contents: read
