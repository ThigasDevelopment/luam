name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm -r typecheck

    test:
        name: Test on Node ${{ matrix.node-version }}
        needs: typecheck
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                node-version: ['20', '22', '24']
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Compiler, runtime, and mta-types
              run: pnpm --filter @luam/compiler --filter @luam/runtime --filter @luam/mta-types --filter @luam/template test

            - name: CLI
              run: pnpm --filter @luam/cli test

            - name: LSP and VS Code extension
              run: pnpm --filter @luam/lsp --filter luam test

    build:
        name: Build
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm -r build

            - name: Bundle the CLI
              run: pnpm --filter @luam/cli bundle

            - name: Build a resource with the bundled CLI
              run: |
                  mkdir -p "$RUNNER_TEMP/smoke"
                  cd "$RUNNER_TEMP/smoke"
                  node "$GITHUB_WORKSPACE/packages/cli/dist/luam.mjs" init --name luam-smoke
                  node "$GITHUB_WORKSPACE/packages/cli/dist/luam.mjs" check
                  node "$GITHUB_WORKSPACE/packages/cli/dist/luam.mjs" build
                  test -f build/luam-smoke/meta.xml
                  test -f build/luam-smoke/src/server/main.lua
                  test -f build/luam-smoke/src/shared/lib/class.lua
                  test -f build/luam-smoke/src/server/lib/env.lua
                  test -f build/luam-smoke/config.lua
                  test -f build/luam-smoke/.env
                  ! grep -q '<file src=".env"' build/luam-smoke/meta.xml

    benchmark:
        name: Benchmark
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm --filter @luam/compiler test:bench

    audit:
        name: Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup

            - name: Production dependencies
              run: pnpm audit --audit-level moderate --prod

            - name: Development dependencies
              run: pnpm audit --audit-level moderate || true
