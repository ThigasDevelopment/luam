name: Setup
description: Install pnpm and Node, restore the store cache, and install workspace dependencies.

inputs:
    node-version:
        description: Node version to install.
        required: false
        default: '22'
    registry-url:
        description: npm registry to authenticate against. Set it only when the job publishes.
        required: false
        default: ''

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
          with:
              node-version: ${{ inputs.node-version }}
              registry-url: ${{ inputs.registry-url }}
              cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile
          shell: bash
