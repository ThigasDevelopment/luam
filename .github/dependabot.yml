version: 2

updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      labels:
          - dependencies
      groups:
          types:
              patterns:
                  - '@types/*'
          tooling:
              patterns:
                  - 'esbuild'
                  - 'typescript'
                  - 'vitest'

    - package-ecosystem: github-actions
      directories:
          - '/'
          - '/.github/actions/setup'
      schedule:
          interval: weekly
      labels:
          - dependencies
      groups:
          actions:
              patterns:
                  - '*'
